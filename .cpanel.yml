---
# cPanel Git Version Control runs these after Deploy.
# Register the clone in Application Manager with startup file app.js first.
deployment:
  tasks:
    - /bin/mkdir -p tmp
    - /bin/bash -c 'export PATH="/opt/cpanel/ea-nodejs22/bin:/opt/cpanel/ea-nodejs20/bin:/opt/cpanel/ea-nodejs18/bin:$PATH"; npm install; npm run build'
    - /bin/touch tmp/restart.txt
